name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, static analysis, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, mbstring, bcmath, sodium, zip, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

  tests:
    name: Pest on MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: muallaf_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Real environment variables take precedence over .env; tests need DDL rights.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: muallaf_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_COLLATION: utf8mb4_0900_ai_ci
      # Restricted application user, used only by the append-only grant test.
      DB_APP_USERNAME: muallaf_app
      DB_APP_PASSWORD: app-password
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, mbstring, bcmath, sodium, zip, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Application DB user with table-level grants
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE USER 'muallaf_app'@'%' IDENTIFIED BY 'app-password'"
          php artisan migrate --force
          php artisan db:sync-app-grants --connection=mysql --user=muallaf_app --host=%

      - name: Tests
        run: vendor/bin/pest

      - name: Tenant isolation tests
        run: vendor/bin/pest --group=tenant-isolation
